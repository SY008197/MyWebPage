experiences:
- company:
    name: 학과 게임 개발 동아리 GPU — Unity 2D 게임 팀 프로젝트
    url: "https://github.com/JUNUKJUNUKJUNUKJUNUKJUNUK/DDUKDDUK.git"
    location: 전북대학교 게임 개발 동아리 GPU (팀 활동)
    overview: "팀원들이 각자 개발한 UI, 시나리오, 인벤토리 데이터를 충돌 없이 저장·복원할 수 있도록 모듈화된 공통 게임 시스템과 상태 관리 구조를 구축하는 것을 목표로 진행한 팀 프로젝트입니다."
  positions:
  - designation: 시스템 아키텍처 및 공통 데이터 매니저 개발 담당
    start: 2026.10
    end: 진행 중
    responsibilities:
    - "**[본인 역할 및 기여 범위]** 팀 공동 작업(게임 기획 및 에셋 통합) 중 **시스템 프로그래머**를 맡아 게임 상태 데이터 분리, 전역 매니저 구조 설계, 세이브/로드 모듈 구현을 전담함."
    - "**[수행 과정 및 선택 이유]** 요구사항 분석 → 상태 데이터 스키마 설계 → 매니저 스크립트 구현 → 씬 연동 테스트 순으로 진행함. 씬 전환 시에도 데이터가 유지되고 구조체를 직렬화하기 쉬운 **Unity(C#) 싱글톤 패턴과 JSON 직렬화 방식**을 선택하여 파트 간 결합도를 낮춤."
    - "**[산출물 및 결과 설명]** C# 기반 상태 관리 스크립트와 세이브/로드 프로토타입 모듈을 구현하여, 플레이어 스탯 및 진행 상태가 파일로 정상 저장·로드되고 씬 전환 시 유지되는 결과를 확인함."
    - "**[학습 결과와 개선 방향]** 정적 매니저와 순수 상태 데이터를 분리해야 디버깅과 기능 확장이 쉬워진다는 점을 배웠으나, 데이터 항목 증가 시 하드코딩된 참조가 늘어나는 한계를 확인함. 향후 이벤트 버스(Event Bus) 패턴과 데이터 암호화를 적용해 구조를 고도화할 계획임."

- company:
    name: Hugo & GitHub Actions 기반 개인 포트폴리오 웹사이트 구축
    url: "https://sy008197.github.io/movie-lab-actions/"
    location: 초급프로젝트 실습(개인 활동)
    overview: "Hugo와 CI/CD 자동 배포 파이프라인을 활용해 본인의 역량과 개발 활동을 체계적으로 기록·공개하는 반응형 개인 웹사이트를 구축하고자 수행한 개인 프로젝트입니다."
  positions:
  - designation: 사이트 기획·커스터마이징·배포 전 과정 1인 수행
    start: 2026.10
    end: 완료
    responsibilities:
    - "**[본인 역할 및 기여 범위]** **개인 단독 수행 활동**으로 테마 선정(Toha), 한국어/영어 다국어 데이터 구성, 카드 레이아웃 템플릿(`skill.html`, `about.html`) 커스터마이징, GitHub Actions 배포 설정 및 검증을 직접 수행함."
    - "**[수행 과정 및 선택 이유]** 테마 구조 분석 → YAML 데이터 개인화 → HTML/CSS 레이아웃 수정 → GitHub Actions 자동 배포 검증 순으로 진행함. 마크다운과 YAML 데이터 파일만으로 콘텐츠를 빠르게 관리할 수 있고 빌드 속도가 빠른 **Hugo와 GitHub Actions** 조합을 선택함."
    - "**[산출물 및 결과 설명]** [공개 포트폴리오 웹사이트](https://sy008197.github.io/MyWebPage/)와 [GitHub 소스 저장소](https://github.com/SY008197/MyWebPage)를 구축 완료하였으며, 데스크톱(1440px)·모바일(390px) 반응형 동작과 자동 배포 성공을 확인함."
    - "**[학습 결과와 개선 방향]** Hugo의 부분 템플릿(Partial)과 다국어(`ko`/`en`) 데이터 바인딩 원리를 익혔으며, 향후 실제 게임 프로젝트의 플레이 영상과 기술 개발 일지를 지속적으로 아카이빙할 계획임."
