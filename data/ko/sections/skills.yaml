# section information
section:
  name: Skills
  id: skills
  enable: true
  weight: 2
  showOnNavbar: true
  filter: true
  # Can optionally hide the title in sections
  # hideTitle: true

# filter buttons
buttons:
- name: All
  filter: "all"
- name: 전공
  filter: "major"
- name: 취미
  filter: "hobby"
- name: 수학
  filter: "math"
- name: 언어
  filter: "language"
- name: 기타
  filter: "others"

# Your Skills.
# Give a summary of you each skill in the summary section.
skills:
# 전체: all
# 전공: 알고리즘, 이산수학, 선형대수, 확통, 자료구조, 컴구조, C++, 객지, 리눅스
# 언어: 파이썬, c/c++, Java, c#
# 수학: 이산수학, 확통, 선형대수
# 취미: 일렉기타, 러닝 
- name: 알고리즘
  categories: ["major"]

- name: 자료구조
  categories: ["major"]

- name: 컴퓨터구조
  categories: ["major"]

- name: 리눅스
  categories: ["major"]

- name: 객체지향 프로그래밍
  categories: ["major"]

- name: C/C++
  categories: ["major", "language"]

- name: Java
  categories: ["language"]

- name: C#
  categories: ["language"]

- name: Python
  categories: ["language"]

- name: 선형대수학
  categories: ["major", "math"]

- name: 이산수학
  categories: ["major", "math"]

- name: 확률및통계
  categories: ["major", "math"]

- name: 일렉기타
  categories: ["hobby"]

- name: 러닝
  categories: ["hobby"]

- name: 유니티
