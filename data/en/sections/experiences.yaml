experiences:
- company:
    name: Game Dev Club GPU — Unity 2D Team Game Project
    url: "https://github.com/JUNUKJUNUKJUNUKJUNUKJUNUK/DDUKDDUK"
    location: JBNU Game Development Club GPU (Team Activity)
    overview: "[Objective] A collaborative team game project aimed at building a modular shared game system and state management architecture so UI, narrative, and inventory modules can save and restore data without conflicts."
  positions:
  - designation: System Architecture & Shared Data Manager Developer
    start: Oct 2026
    end: In Progress
    responsibilities:
    - "**[Role & Contribution]** Within our team collaboration, I took charge of **systems programming**, specifically designing decoupled state data structures, global manager patterns, and the save/load module."
    - "**[Process & Technical Choice]** Proceeded from requirement analysis and data schema design to C# manager implementation and scene integration testing. Chose **Unity (C#) singleton managers with JSON serialization** to persist data across scenes while minimizing coupling between team members' modules."
    - "**[Deliverables & Results]** Implemented C# state management scripts and a working save/load prototype module, verifying that player stats and progress are accurately saved to disk and restored across scene transitions."
    - "**[Takeaways & Future Improvements]** Learned that separating static managers from raw state data simplifies debugging, but identified a limitation where direct references grow as data types expand. Next, I plan to introduce an Event Bus pattern and save-file encryption."

- company:
    name: Personal Portfolio Website with Hugo & GitHub Actions
    url: "https://github.com/SY008197/MyWebPage"
    location: Junior Project Coursework (Individual Activity)
    overview: "[Objective] An individual project to build and deploy a responsive, multilingual personal portfolio website using Hugo and GitHub Actions CI/CD."
  positions:
  - designation: Sole Developer (Planning, Customization & CI/CD Deployment)
    start: Oct 2026
    end: Completed
    responsibilities:
    - "**[Role & Contribution]** **Completed individually**, covering theme selection (Toha), Korean/English data configuration, partial template (`skill.html`, `about.html`) layout customization, and GitHub Actions workflow verification."
    - "**[Process & Technical Choice]** Analyzed theme structure, customized YAML data, refined HTML/CSS card layouts, and verified automated deployment. Selected **Hugo and GitHub Actions** for fast static builds and clean separation between YAML data and layout templates."
    - "**[Deliverables & Results]** Published the [live portfolio website](https://sy008197.github.io/MyWebPage/) and [GitHub repository](https://github.com/SY008197/MyWebPage), confirming responsive rendering at 1440px and 390px."
    - "**[Takeaways & Future Improvements]** Mastered Hugo partial templates and multilingual data binding; next, I plan to continuously archive devlogs and playable build demos from my indie game projects."
